name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  VERSION: ${{ github.ref_name }}

jobs:
  # rickserve is a plain Go daemon published by the rick CLI repo but not
  # shipped in its release assets, so the desktop release builds it from the
  # latest rick source and publishes it under the desktop version. The app's
  # "Install Rick" flow downloads these to pair with the rick CLI binary.
  rickserve:
    name: Build rickserve binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Resolve latest rick release
        id: rickver
        run: |
          RICK_VERSION="$(curl -fsSL https://api.github.com/repos/rick-cli/rick/releases/latest | python3 -c 'import json,sys;print(json.load(sys.stdin)["tag_name"])')"
          echo "version=$RICK_VERSION" >> "$GITHUB_OUTPUT"
      - name: Check out rick source
        run: git clone --depth 1 --branch "${{ steps.rickver.outputs.version }}" https://github.com/rick-cli/rick.git rick-src
      - name: Build rickserve for every platform
        run: |
          cd rick-src
          V="${VERSION#v}"
          for target in "linux amd64" "linux arm64" "windows amd64" "darwin amd64" "darwin arm64"; do
            set -- $target
            suffix=""
            [ "$1" = "windows" ] && suffix=".exe"
            GOOS="$1" GOARCH="$2" CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" \
              -o "rickserve-v${V}-$1-$2${suffix}" ./cmd/rickserve
          done
        env:
          VERSION: ${{ env.VERSION }}
      - uses: actions/upload-artifact@v4
        with:
          name: rickserve
          path: rick-src/rickserve-*

  windows:
    name: Build Windows (NSIS installer + portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Set release version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/\"productVersion\": \"[^\"]*\"/\"productVersion\": \"$VERSION\"/" wails.json
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build installer + portable binary
        shell: bash
        run: |
          export PATH="$PATH:/c/Program Files (x86)/NSIS:$(go env GOPATH)/bin"
          wails build -clean -nsis -ldflags "-s -w -X main.Version=$VERSION"
          mkdir -p build/dist
          cp build/bin/RickDesktop-amd64-installer.exe "build/dist/RickDesktop-Setup-v${VERSION}-windows-amd64.exe"
          cp build/bin/RickDesktop.exe "build/dist/RickDesktop-v${VERSION}-windows-amd64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/dist/*

  macos:
    name: Build macOS (${{ matrix.arch }} app + portable)
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - name: Set release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i '' "s/\"productVersion\": \"[^\"]*\"/\"productVersion\": \"$VERSION\"/" wails.json
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build app bundle
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          wails build -clean -platform "darwin/${{ matrix.arch }}" -ldflags "-s -w -X main.Version=$VERSION"
          mkdir -p build/dist
          ditto -c -k --sequesterRsrc --keepParent build/bin/RickDesktop.app \
            "build/dist/RickDesktop-v${VERSION}-darwin-${{ matrix.arch }}.app.zip"
          cp build/bin/RickDesktop.app/Contents/MacOS/RickDesktop \
            "build/dist/RickDesktop-v${VERSION}-darwin-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: build/dist/*

  linux:
    name: Build Linux (${{ matrix.arch }} deb + portable)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install wails build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev build-essential
      - name: Install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - name: Set release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/\"productVersion\": \"[^\"]*\"/\"productVersion\": \"$VERSION\"/" wails.json
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build portable binary + .deb package
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          wails build -clean -platform "linux/${{ matrix.arch }}" -ldflags "-s -w -X main.Version=$VERSION"
          mkdir -p build/dist
          cp build/bin/RickDesktop "build/dist/RickDesktop-v${VERSION}-linux-${{ matrix.arch }}"
          PACKAGE_ROOT="build/deb/rickdesktop_${VERSION}_${{ matrix.arch }}"
          mkdir -p "$PACKAGE_ROOT/usr/bin" "$PACKAGE_ROOT/usr/share/applications" "$PACKAGE_ROOT/usr/share/icons/hicolor/256x256/apps" "$PACKAGE_ROOT/DEBIAN"
          install -m 0755 build/bin/RickDesktop "$PACKAGE_ROOT/usr/bin/rickdesktop"
          install -m 0644 build/appicon.png "$PACKAGE_ROOT/usr/share/icons/hicolor/256x256/apps/rickdesktop.png"
          cat > "$PACKAGE_ROOT/usr/share/applications/rickdesktop.desktop" <<'EOF'
          [Desktop Entry]
          Name=Rick Desktop
          Comment=Rick AI coding agent desktop
          Exec=rickdesktop
          Icon=rickdesktop
          Terminal=false
          Type=Application
          Categories=Development;Utility;
          EOF
          cat > "$PACKAGE_ROOT/DEBIAN/control" <<EOF
          Package: rickdesktop
          Version: $VERSION
          Section: devel
          Priority: optional
          Architecture: ${{ matrix.arch }}
          Maintainer: rick-cli <menschlo23@gmail.com>
          Description: Visual desktop workspace for the rick AI coding agent
           Rick Desktop drives the rick CLI through a local chat, tools and session UI.
          EOF
          dpkg-deb --build --root-owner-group "$PACKAGE_ROOT" "build/dist/RickDesktop-v${VERSION}-linux-${{ matrix.arch }}.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: build/dist/*

  publish:
    name: Publish GitHub release
    needs: [rickserve, windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Add install / update scripts
        run: cp scripts/install.sh scripts/Install-RickDesktop.ps1 scripts/install-update.sh scripts/install-update.ps1 dist/
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
